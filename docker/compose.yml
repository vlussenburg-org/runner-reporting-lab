# Three self-hosted runners, each pretending to live in a different "cloud".
# Same machine (your laptop, via Docker) — the ONLY thing that distinguishes
# them to GitHub is the LABELS value. That's the whole point of the lab.
#
# Usage: scripts/register-runners.sh  (exports the token + brings these up)

services:
  runner-azure:
    image: myoung34/github-runner:latest
    restart: "no"
    environment:
      ACCESS_TOKEN: ${RUNNER_LAB_TOKEN}
      REPO_URL: https://github.com/vlussenburg-org/runner-reporting-lab
      RUNNER_NAME: azure-runner
      LABELS: azure
      RUNNER_SCOPE: repo
      EPHEMERAL: "false"
      DISABLE_AUTO_UPDATE: "true"
      RUNNER_WORKDIR: /tmp/runner/work

  runner-gcp:
    image: myoung34/github-runner:latest
    restart: "no"
    environment:
      ACCESS_TOKEN: ${RUNNER_LAB_TOKEN}
      REPO_URL: https://github.com/vlussenburg-org/runner-reporting-lab
      RUNNER_NAME: gcp-runner
      LABELS: gcp
      RUNNER_SCOPE: repo
      EPHEMERAL: "false"
      DISABLE_AUTO_UPDATE: "true"
      RUNNER_WORKDIR: /tmp/runner/work

  runner-vm:
    image: myoung34/github-runner:latest
    restart: "no"
    environment:
      ACCESS_TOKEN: ${RUNNER_LAB_TOKEN}
      REPO_URL: https://github.com/vlussenburg-org/runner-reporting-lab
      RUNNER_NAME: vm-runner
      LABELS: vm
      RUNNER_SCOPE: repo
      EPHEMERAL: "false"
      DISABLE_AUTO_UPDATE: "true"
      RUNNER_WORKDIR: /tmp/runner/work
